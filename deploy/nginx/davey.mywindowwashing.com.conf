# =============================================================================
#  davey.mywindowwashing.com — nginx server configuration
# =============================================================================
#
#  Install to:  /etc/nginx/sites-available/davey.mywindowwashing.com
#  Symlink to:  /etc/nginx/sites-enabled/davey.mywindowwashing.com
#  (deploy/setup-vps.sh does both.)
#
#  Canonical URL shapes:
#    home   https://davey.mywindowwashing.com/
#    page   https://davey.mywindowwashing.com/about        (no .html, no slash)
#    dir    https://davey.mywindowwashing.com/blog/        (trailing slash)
#
#  This site is a separate brand from mywindowwashing.com. It does not share
#  that site's robots.txt or sitemap.xml, and it needs its own Google Search
#  Console property.
#
# =============================================================================


# -----------------------------------------------------------------------------
#  Port 80 — ACME challenges, then redirect everything else to HTTPS
# -----------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name davey.mywindowwashing.com www.davey.mywindowwashing.com;

    # Certbot writes renewal challenges here. This lives OUTSIDE the deploy
    # directory on purpose: the deploy rsyncs with --delete, which would
    # otherwise wipe a challenge file mid-renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://davey.mywindowwashing.com$request_uri;
    }
}


# -----------------------------------------------------------------------------
#  Port 443 — the site
# -----------------------------------------------------------------------------
server {
    # The http2 listen parameter works on every nginx in current distros.
    # nginx >= 1.25.1 logs a deprecation warning for it and prefers a separate
    # `http2 on;` directive — which older nginx rejects outright. Warning on
    # new builds beats failing to start on old ones.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name davey.mywindowwashing.com;

    root    /var/www/davey/public;
    index   index.html;
    charset utf-8;

    access_log /var/log/nginx/davey.access.log;
    error_log  /var/log/nginx/davey.error.log;

    # --- TLS ---------------------------------------------------------------
    # certbot --nginx rewrites these paths on first issue. Kept here so the
    # config is complete and reviewable in git.
    ssl_certificate     /etc/letsencrypt/live/davey.mywindowwashing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/davey.mywindowwashing.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---------------------------------------------------
    # Set at server level. Location blocks below deliberately use `expires`
    # rather than add_header for caching, because any add_header inside a
    # location discards every add_header inherited from here.
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    # Enable once you have confirmed HTTPS works end to end. Once a browser
    # sees this it will refuse plain HTTP for this host for the full max-age.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- URL canonicalisation ----------------------------------------------
    # These test $request_uri, which holds the URI the browser actually asked
    # for and is NOT rewritten by try_files. That is what keeps the .html
    # redirect below from looping against the internal rewrite in `location /`.
    if ($request_uri ~ ^/index\.html(\?|$)) {
        return 301 /;
    }
    if ($request_uri ~ ^/(.*)/index\.html(\?|$)) {
        return 301 /$1/;
    }
    # The negative lookahead keeps Search Console's verification file at its
    # exact .html path — Google fetches that URL literally, and redirecting it
    # can cost the property's verification. A location block cannot do this:
    # server-level `if` runs in the rewrite phase, before a location is chosen.
    if ($request_uri ~ ^/(?!google[0-9a-f]+\.html)(.*)\.html(\?|$)) {
        return 301 /$1;
    }

    # Trailing slash on something that is a page, not a directory: /about/
    # becomes /about. Real directories fall through to their index.html.
    location ~ ^/(?<page>.+)/$ {
        if (-f $document_root/$page.html) {
            return 301 /$page;
        }
        try_files $uri ${uri}index.html =404;
    }

    # --- Caching ------------------------------------------------------------
    location ~* \.(?:jpg|jpeg|png|gif|ico|webp|avif|svg|mp4|webm|woff2?)$ {
        expires 1y;
        access_log off;
    }

    location ~* \.(?:js|pdf)$ {
        expires 30d;
    }

    location ~* \.css$ {
        expires 7d;
    }

    # robots.txt and sitemap.xml must never be served stale.
    location = /robots.txt  { expires -1; }
    location = /sitemap.xml { expires -1; }

    # --- Routing ------------------------------------------------------------
    # Serves /about from about.html so pages stay extensionless.
    location / {
        try_files $uri $uri.html $uri/ =404;

        # HTML is revalidated on every request so a deploy shows up
        # immediately. This belongs here rather than in a `\.html$` location:
        # try_files resolves /about to about.html inside *this* context and
        # never re-matches against a regex location.
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # --- Compression --------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/xml
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
}
